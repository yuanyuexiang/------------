name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a production migration/deployment with a newer push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .

  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -ra

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/jb-web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/jb-web/package-lock.json
      - run: npm ci
      - run: npm run build

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check deployment scripts and Compose
        env:
          POSTGRES_PASSWORD: ci-placeholder
          JB_SECRET_KEY: ci-placeholder
          JB_ADMIN_PASSWORD: ci-placeholder
          JB_API_IMAGE: jinbang-api:ci
          JB_WEB_IMAGE: jinbang-web:ci
        run: |
          bash -n deploy/deploy.sh deploy/init-production.sh
          docker compose -f deploy/compose.prod.yml config --quiet
          ssh-keygen -F 36.151.147.66 -f deploy/known_hosts >/dev/null

  deploy:
    name: Deploy production
    needs: [lint, test, frontend, deployment-config]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    environment:
      name: production
      url: https://jinbang.matrix-net.tech
    concurrency:
      group: jinbang-production
      cancel-in-progress: false
    env:
      REGISTRY: ${{ vars.REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'yuanyuexiang' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set image namespace
        run: echo "IMAGE_PREFIX=$REGISTRY/$REGISTRY_NAMESPACE/jinbang" >> "$GITHUB_ENV"
      - name: Validate credentials and configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          : "${DEPLOY_HOST:?Missing production secret DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing production secret DEPLOY_USER}"
          : "${SSH_KEY:?Missing production secret DEPLOY_SSH_KEY}"
          : "${REGISTRY_USERNAME:?Missing production secret REGISTRY_USERNAME}"
          : "${REGISTRY_PASSWORD:?Missing production secret REGISTRY_PASSWORD}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -P '' -f ~/.ssh/id_rsa >/dev/null
          cp deploy/known_hosts ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo '::error::DEPLOY_HOST has no trusted key in deploy/known_hosts'
            exit 1
          }
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker compose version && docker network inspect matrix-network >/dev/null && command -v python3 && command -v flock && command -v curl'
      - name: Initialize production environment (preserve existing configuration)
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' < deploy/init-production.sh
      - name: Build and publish commit-tagged images
        run: |
          docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -f deploy/Dockerfile.api -t "$IMAGE_PREFIX-api:$GITHUB_SHA" .
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -f deploy/Dockerfile.web -t "$IMAGE_PREFIX-web:$GITHUB_SHA" .
          docker push "$IMAGE_PREFIX-api:$GITHUB_SHA"
          docker push "$IMAGE_PREFIX-web:$GITHUB_SHA"
      - name: Upload release and deploy
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          release="/opt/jinbang/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'JB_API_IMAGE=%s-api:%s\nJB_WEB_IMAGE=%s-web:%s\n' \
            "$IMAGE_PREFIX" "$GITHUB_SHA" "$IMAGE_PREFIX" "$GITHUB_SHA" > release.env
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$release'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/compose.prod.yml deploy/deploy.sh release.env "$DEPLOY_USER@$DEPLOY_HOST:$release/"
          # Keep registry credentials in an isolated config only for this SSH session.
          printf -v remote_deploy '%q ' bash -c '
            set -Eeuo pipefail
            umask 077
            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            cleanup() { rm -rf "$DOCKER_CONFIG"; }
            trap cleanup EXIT
            docker login "$1" -u "$2" --password-stdin
            bash "$3/deploy.sh" "$3"
          ' bash "$REGISTRY" "$REGISTRY_USERNAME" "$release"
          printf '%s' "$REGISTRY_PASSWORD" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_deploy"
      - name: Remove runner credentials
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          docker logout "$REGISTRY"
