[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jinbang"
version = "0.1.0"
description = "Jinbang（金榜）——国网智能投标 Agent 系统"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]
pg = ["psycopg[binary]>=3.1"]     # PostgreSQL 驱动（compose 部署）
worker = ["celery>=5.3", "redis>=5.0"]

[project.scripts]
jb-parse = "jb_parser.cli:main"
jb-qualify = "jb_agents.cli:main"

# 顶层导入名：jb_parser（领域包，位于 packages/）、jb_api（HTTP 层，位于 apps/）
[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["jb_parser*", "jb_api*", "jb_kb*", "jb_llm*", "jb_agents*", "jb_store*", "jb_docgen*", "jb_rules*"]

[tool.pytest.ini_options]
# 未安装（pip install -e）时也能直接 pytest：把两个源码根加入导入路径
pythonpath = ["packages", "apps"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP007/UP045(PEP604 unions)：Pydantic 在 py3.9 运行时求值注解，X|None 会崩，保留 Optional
ignore = ["E501", "UP007", "UP045"]
