# Jinbang（金榜）部署编排。
#   核心:      docker compose up -d          （web/api/db/redis/minio）
#   文档转换:  docker compose --profile docgen up -d   （S3 起用）
#   LLM 网关:  docker compose --profile llm up -d      （接入模型账号后用）
name: jinbang

services:
  jb-web:
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    ports: ["8080:80"]
    depends_on: [jb-api]

  jb-api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jinbang}:${POSTGRES_PASSWORD:-jinbang-dev-only}@db:5432/${POSTGRES_DB:-jinbang}
      CELERY_BROKER_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-jinbang}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-jinbang-dev-only}
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]   # api 与 worker 共享上传目录
    command: sh -c "alembic -c deploy/alembic.ini upgrade head && uvicorn jb_api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  jb-worker:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    command: celery -A jb_api.tasks worker -l info --concurrency=2
    healthcheck:   # 覆盖镜像默认的 HTTP 健康检查（worker 无 HTTP 端口）
      test: ["CMD-SHELL", "celery -A jb_api.tasks inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jinbang}:${POSTGRES_PASSWORD:-jinbang-dev-only}@db:5432/${POSTGRES_DB:-jinbang}
      CELERY_BROKER_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jinbang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jinbang-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-jinbang}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jinbang}"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]   # 开发期暴露；生产收回

  redis:
    image: redis:7-alpine
    volumes: ["redisdata:/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jinbang}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jinbang-dev-only}
    volumes: ["miniodata:/data"]
    ports: ["9001:9001"]   # 控制台；生产收回

  # ---- profile: docgen（S3 文档转换，docx→PDF，HTTP API）----
  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: [docgen]

  # ---- profile: llm（统一 LLM 网关，多模型/记账/限流）----
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: [llm]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-jinbang-dev}
    volumes: ["./deploy/litellm.yaml:/app/config.yaml:ro"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]

volumes:
  uploads:
  pgdata:
  redisdata:
  miniodata:
