server {
    listen 80;
    client_max_body_size 1024m;   # 招标文件包可达数百MB

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    location /api/ {
        proxy_pass http://jb-api:8000;
        proxy_read_timeout 600s;   # 解析为分钟级任务（S2 接 Celery 后可收紧）
        proxy_request_buffering off;
    }
}
