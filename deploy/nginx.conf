server {
    listen 80;
    client_max_body_size 1024m;   # 招标文件包可达数百MB

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    # 用 Docker 内置 DNS 动态解析上游：jb-api 重建换 IP 后不再 502（写死 proxy_pass 主机名只在启动时解析一次）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream jb-api:8000;
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_read_timeout 600s;   # 解析为分钟级任务（S2 接 Celery 后可收紧）
        proxy_request_buffering off;
    }
}
